<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
  <meta name="description" content="Görevlerinizi kolayca yönetin">
  <title>Görev Uygulaması</title>
  <p id="counter"></p>
  <input type="text" id="search" placeholder="Görev ara...">
  <button id="clearAll">Hepsini Sil</button>
  <div id="counter"></div>
  <ul id="taskList"></ul>
  <h3>Çöp kutusu🗑️</h3>
  <ul id="trashList"></ul>
  <button id="darkModeBtn">Modunuzu seçin🌙</button>
  <input type="date" id="taskDate">
  <select id="priority">
  <option value="low">Önemli değil</option>
  <option value="medium">Önemli</option>
  <option value="high">Acil</option>
  </select> 

  <style>
    body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to right, #ab5757, #e57db3);
  display: flow-root;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: rgb(151, 99, 99);
  padding: 10px;
  border-radius: 10px;
  width: 200px;
  box-shadow: 0 10px 25px rgba(78, 14, 4, 0.2);
  text-align:unset;
}

.top-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #858585;
}

button {
  padding: 10px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: #d1c8c6;
  color: rgb(44, 16, 16);
}
button:hover {
  opacity: 0.6;
}

ul {
  list-style: none;
  padding: 0;
}
li {
  background: hsla(0, 66%, 82%, 0.901);
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  display:flex;
  justify-content: space-between;
  align-items: center;
}
li span {
  color: rgb(255, 255, 255);
  font-size: 15px;
  font-weight: bolder;
}
.completed span {
  text-decoration: line-through;
  opacity: 0.6;
}

#counter {
  font-weight:bolder;
  margin-bottom: 10px;
}

#trashList li {
  opacity: 0.4;
  margin-top: 10px;
  border-top: 2px dashed #4f3d7f;
  padding-top: 10px;
}

.dark {
  background: #424a64;
  color: rgb(184, 185, 196);
}

.dark li {
  background: #5d5d76;
}

body.dark li.completed span {
  color: #9d9999;
  text-decoration: line-through;
}

body.dark .container {
  background-color: #191731;
  color: rgb(177, 166, 166);
  box-shadow: 0 0 20px rgba(13, 4, 36, 0.6);
}
body.dark {
  background: linear-gradient(135deg, #0a0434, #191a5e, #453994);
}
.dark input {
  background: #c6c2c2;
  color: rgb(36, 34, 75);
  border: none;
}
.top-bar {
  margin-bottom: 15px;
}
#searchInput {
  width: 100%;
  background: #fffafa;
}

.high { border-left: 15px solid rgb(246, 73, 73); }
.medium { border-left: 15px solid rgb(239, 230, 103); }
.low { border-left: 15px solid rgb(171, 228, 171); }

</style>
</head>
<body>
 
<div class="container">
  <div class="top-bar">
    <input id="taskInput" placeholder="Görev yaz">
    <button id="addBtn">Ekle</button>
  </div>
  <div id="counter"></div>
  <ul id="taskList"></ul>
</div>

<script>
function createTask(text, completed = false, date = "", priority = "low") {

  let li = document.createElement("li");
  li.dataset.date = date;
  li.classList.add(priority);

  let span = document.createElement("span");
  span.textContent = date ? text + " 📅 " + date : text;

  let deleteBtn = document.createElement("button");
  deleteBtn.textContent = "Sil";

  let doneBtn = document.createElement("button");
  doneBtn.textContent = "✔️";

  if (completed) li.classList.add("completed");

  doneBtn.addEventListener("click", function() {
    li.classList.toggle("completed");
    updateCounter();
    saveTasks();
  });

  deleteBtn.addEventListener("click", function() {
    let trash = document.getElementById("trashList");
    if (!trash) return;

    let restoreBtn = document.createElement("button");
    restoreBtn.textContent = "Geri Al";

    deleteBtn.style.display = "none";
    li.appendChild(restoreBtn);
    trash.appendChild(li);

    updateCounter();

    restoreBtn.addEventListener("click", function() {
      restoreBtn.remove();
      deleteBtn.style.display = "inline-block";
      document.getElementById("taskList").appendChild(li);
      updateCounter();
    });
  });

  li.appendChild(span);
  li.appendChild(doneBtn);
  li.appendChild(deleteBtn);

  document.getElementById("taskList").appendChild(li);

  updateCounter();
  saveTasks();
}

document.addEventListener("DOMContentLoaded", function() {

  let button = document.getElementById("addBtn");
  let input = document.getElementById("taskInput");
  let search = document.getElementById("search");
  let clearBtn = document.getElementById("clearAll");
  let darkBtn = document.getElementById("darkModeBtn");

  window.updateCounter = function() {
    let tasks = document.querySelectorAll("#taskList li");
    let completed = document.querySelectorAll("#taskList li.completed");

    document.getElementById("counter").textContent =
      "Toplam: " + tasks.length + " | Tamamlanan: " + completed.length;

    if (tasks.length > 0 && tasks.length === completed.length) {
      alert("Tüm görevleri bitirdin tebrikler !💪");
    }
  };

  button.addEventListener("click", function() {
    let taskText = input.value;
    let taskDate = document.getElementById("taskDate").value;
    let priority = document.getElementById("priority").value;

    if (taskText.trim() === "") return;

    createTask(taskText, false, taskDate, priority);
    input.value = "";
  });

  input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") button.click();
  });

  search.addEventListener("input", function() {
    let value = this.value.toLowerCase();
    let items = document.querySelectorAll("#taskList li");

    items.forEach(function(li) {
      let text = li.textContent.toLowerCase();
      li.style.display = text.includes(value) ? "flex" : "none";
    });
  });

  clearBtn.addEventListener("click", function() {
    document.getElementById("taskList").innerHTML = "";
    updateCounter();
    saveTasks();
  });

  if (darkBtn) {
    darkBtn.addEventListener("click", function() {
      document.body.classList.toggle("dark");
      localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    });

    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark");
    }
  }

  window.saveTasks = function() {
    let tasks = [];

    document.querySelectorAll("#taskList li").forEach(li => {
      tasks.push({
        text: li.querySelector("span").textContent,
        completed: li.classList.contains("completed"),
        priority: li.classList.contains("high") ? "high" :
                  li.classList.contains("medium") ? "medium" : "low"
      });
    });

    localStorage.setItem("tasks", JSON.stringify(tasks));
  };

  function loadTasks() {
    let tasks = JSON.parse(localStorage.getItem("tasks"));
    if (!tasks) return;

    tasks.forEach(t => {
      createTask(t.text, t.completed, "", t.priority);
    });
  }

  loadTasks(); 

});
</script>
</body>
</html>
